experiment_id: m0_v2_final_minus_xlam_matched_exposure
hypothesis: >-
  Joint xLAM-plus-CALL_PREDICTION removal, MATCHED-EXPOSURE arm. The completed
  `m0_sft_canonical_v2_final` run is the reference and is not modified or rerun. This run filters
  xLAM from the identical frozen corpus; because xLAM is currently the only source providing
  `CALL_PREDICTION`, that source filter also removes the corpus's entire call-prediction channel.

  THE QUESTION THIS ARM ANSWERS. At approximately matched loss-bearing exposure, what is the
  effect of removing xLAM together with `CALL_PREDICTION`?

  HOW THE STEP COUNT WAS OBTAINED. Not by judgement, and not rounded to a comfortable number:

      matched_steps = 2400 x (29,630,369 / 33,565,721) = 2118.6 -> 2119

  Both token counts come from the reference run's rendered cache. Matching supervised tokens is
  deliberate because they are the mass acted on by the loss; rendered tokens include ignored
  context and record counts ignore length. The alternatives remain recorded:

      supervised tokens  0.882757  -> 2119 steps   (used)
      rendered tokens    0.643286  -> 1544 steps
      record counts      0.653693  -> 1569 steps

  WHAT THIS ARM CANNOT SEPARATE, STATED IN ADVANCE. Source identity and supervision type are
  perfectly aligned in Canonical-v2, so this is not an xLAM-content-only effect. It also spends
  fewer optimizer steps and FLOPs than the reference: 2,119 versus 2,400. Any observed difference
  combines the joint source/channel removal with an 11.7% smaller optimization budget. The
  fixed-compute arm exposes that compute/exposure sensitivity, and the two arms are reported
  together or not at all. If they disagree, that disagreement is reported rather than resolved by
  preferring the more flattering result.

  WHAT COUNTS AS EVIDENCE. A single seeded run is a finding to record and test again, not settled
  attribution. No xLAM-specific causal claim is valid unless another evidence-backed
  `CALL_PREDICTION` source makes source identity separable from supervision type. A separate
  `CALL_PREDICTION`-only versus `COMPLETE_TRAJECTORY`-only design studies supervision composition,
  but it remains source-confounded in the present corpus and is not executed by this arm.

model:
  model_id: Qwen/Qwen3.5-2B
  model_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
  tokenizer_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc

datasets:
  manifest_ids:
    - canonical_v2_final
  hashes:
    canonical_v2_final: 8ced403b996e563d6e279aee7fdb346fc829fe5ff6af9daf8ef47c0a4007e161
  release_dir: .release/hf/toolpolicy-canonical-v2-final
  # Identical joint source/channel intervention to the fixed-compute arm, so the two arms differ in
  # horizon and nothing else. This is a filter over the frozen corpus, not a rebuild.
  exclude_sources:
    - xlam-function-calling-60k
  yield_report: reports/data/canonical-v2-final-minus-xlam-yield.json
  source_manifests:
    - glaive-function-calling-v2
    - toolace
    - when2call

# The complete post-filter contract set, declared explicitly. This is not an empty or inferred
# selection: all 105,876 retained trainable records are COMPLETE_TRAJECTORY. Readiness fails closed
# with SUPERVISION_SELECTION_MISMATCH if this declaration names a contract absent after filtering.
supervision:
  include:
    - COMPLETE_TRAJECTORY

trainer:
  type: sft
  tuning_method: full
  learning_rate: 1.0e-5
  micro_batch_size: 8
  # Activation memory tracks batch width, not sequence count; see docs/SFT_TRAINING.md.
  micro_batch_tokens: 4096
  gradient_accumulation_steps: 2
  # MATCHED EXPOSURE, calculated above. Every per-step setting is identical to the reference, so
  # the only difference is how long the run lasts.
  max_steps: 2119
  # Scaled with the horizon to hold the same warmup fraction: 120/2400 = 0.05, 0.05 x 2119 = 106.
  warmup_steps: 106
  max_seq_length: 2048
  scheduler: cosine
  gradient_clipping: 1.0
  gradient_checkpointing: true
  optimizer: adamw_torch
  optimizer_state: fp32

evaluation:
  suite: tool_use_core
  baseline_experiment: tool_calling/qwen35_2b/baseline
  # Frozen. Shared with the reference so the two are selected and confirmed on identical evidence.
  checkpoint_selection_manifest: reports/evaluation/behavioral-heldout-v2.manifest.json
  primary_metrics:
    - call_precision
    - call_recall
    - call_f1
    - over_call_rate
    - under_call_rate
    - clarification_accuracy
    - unsupported_accuracy
    - parse_valid_rate

generation:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 512

checkpointing:
  # Checkpoint locations scaled to the horizon rather than inherited from the reference: 25/50/75%
  # of 2119 is 530/1060/1590, and the trainer's final save lands on the 100% point at 2119.
  # Forcing 600/1200/1800/2400 here would mean training past the matched horizon to reach a
  # familiar-looking number, which would defeat the arm.
  save_steps: 530
  max_checkpoints: 4

promotion:
  requires_executed_suite: tool_use_core
  policy_version: tool_use_promotion_v3
  must_pass:
    parse_valid_rate_min: 0.99
  max_regression:
    default: 1.0

reproducibility:
  seed: 42
  precision: bfloat16

speculative_decoding:
  enabled: false
