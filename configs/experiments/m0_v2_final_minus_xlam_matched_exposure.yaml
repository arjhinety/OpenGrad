experiment_id: m0_v2_final_minus_xlam_matched_exposure
hypothesis: >-
  xLAM source ablation, MATCHED-EXPOSURE arm. The completed `m0_sft_canonical_v2_final` run is the
  reference and is not modified or rerun; this run trains the identical recipe on the identical
  frozen corpus with exactly one source removed, for a number of steps calculated from measured
  training mass rather than chosen.

  THE QUESTION THIS ARM ANSWERS. At approximately the same amount of corpus exposure as the
  reference run, what behaviour changes when xLAM supervision is absent?

  HOW THE STEP COUNT WAS OBTAINED. Not by judgement, and not rounded to a comfortable number:

      matched_steps = 2400 x (29,630,369 / 33,565,721) = 2118.6 -> 2119

  Both token counts are measured from the reference run's own rendered sample cache, so they are
  the same samples the reference trained on. 33,565,721 is the corpus wide loss-bearing mass;
  29,630,369 is what remains once xLAM is removed. Matching on SUPERVISED tokens rather than
  rendered tokens or record counts is deliberate: supervised tokens are the mass the loss actually
  acts on, rendered tokens include context the loss ignores, and record counts ignore length
  entirely. Because xLAM's 56,090 records are short -- a call is a small target and carries no
  final response -- the three measures disagree sharply and the choice changes the experiment:

      supervised tokens  0.882757  -> 2119 steps   (used)
      rendered tokens    0.643286  -> 1544 steps
      record counts      0.653693  -> 1569 steps

  Matching on rendered tokens would equalise the forward-pass compute and leave the run seeing
  ~26% LESS loss-bearing mass than the reference, which is a different experiment: it would
  confound exposure with loss density. The number used is the one that holds loss-bearing mass
  equal, and the alternatives are recorded here so the choice can be challenged rather than
  guessed at.

  WHAT THIS ARM CANNOT SEPARATE, STATED IN ADVANCE. It spends less wall-clock and fewer FLOPs than
  the reference: 2,119 steps against 2,400. Any difference observed here therefore mixes the
  absence of xLAM supervision with a smaller optimization budget, and this arm alone cannot
  attribute an effect to either. That is precisely why the fixed-compute arm exists, and the two
  are reported together or not at all.

  THE APPARENT CONTRADICTION THAT IS THE POINT. Removing xLAM costs 34.6% of records but only
  11.7% of supervised tokens, because xLAM records are short. So the two arms pull in opposite
  directions: the fixed-compute arm gives the reduced corpus 1.53x the exposure, and this arm pays
  11.7% less compute. If the arms disagree, that disagreement is a result to report, not a
  discrepancy to resolve by preferring the more flattering one.

  WHAT COUNTS AS EVIDENCE. A single training run is probabilistic. If xLAM's contribution and
  regression both look significant here, that is a finding to record and to test again, not a
  settled attribution.

model:
  model_id: Qwen/Qwen3.5-2B
  model_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
  tokenizer_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc

datasets:
  manifest_ids:
    - canonical_v2_final
  hashes:
    canonical_v2_final: 8ced403b996e563d6e279aee7fdb346fc829fe5ff6af9daf8ef47c0a4007e161
  release_dir: .release/hf/toolpolicy-canonical-v2-final
  # Identical ablation variable to the fixed-compute arm, so the two arms differ in the step count
  # and nothing else. A filter over the frozen corpus, not a rebuild.
  exclude_sources:
    - xlam-function-calling-60k
  yield_report: reports/data/canonical-v2-final-minus-xlam-yield.json
  source_manifests:
    - glaive-function-calling-v2
    - toolace
    - when2call

# Natural sampling over what remains, with no contract targeted.
#
# xLAM was the only source carrying `CALL_PREDICTION`, so removing it removes that contract too and
# `COMPLETE_TRAJECTORY` is all that is left. Declaring it here is a statement of what this run
# trains on, not a second filter: every record the source filter kept is `COMPLETE_TRAJECTORY`, so
# this list selects everything present and excludes nothing. The only data difference from the
# reference remains the xLAM exclusion, and readiness asserts that by failing closed when a config
# selects a kind the corpus does not contain.
supervision:
  include:
    - COMPLETE_TRAJECTORY

trainer:
  type: sft
  tuning_method: full
  learning_rate: 1.0e-5
  micro_batch_size: 8
  # Activation memory tracks batch width, not sequence count; see docs/SFT_TRAINING.md.
  micro_batch_tokens: 4096
  gradient_accumulation_steps: 2
  # MATCHED EXPOSURE, calculated above. Every per-step setting is identical to the reference, so
  # the only difference is how long the run lasts.
  max_steps: 2119
  # Scaled with the horizon to hold the same warmup fraction: 120/2400 = 0.05, 0.05 x 2119 = 106.
  warmup_steps: 106
  max_seq_length: 2048
  scheduler: cosine
  gradient_clipping: 1.0
  gradient_checkpointing: true
  optimizer: adamw_torch
  optimizer_state: fp32

evaluation:
  suite: tool_use_core
  baseline_experiment: tool_calling/qwen35_2b/baseline
  # Frozen. Shared with the reference so the two are selected and confirmed on identical evidence.
  checkpoint_selection_manifest: reports/evaluation/behavioral-heldout-v2.manifest.json
  primary_metrics:
    - call_precision
    - call_recall
    - call_f1
    - over_call_rate
    - under_call_rate
    - clarification_accuracy
    - unsupported_accuracy
    - parse_valid_rate

generation:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 512

checkpointing:
  # Checkpoint locations scaled to the horizon rather than inherited from the reference: 25/50/75%
  # of 2119 is 530/1060/1590, and the trainer's final save lands on the 100% point at 2119.
  # Forcing 600/1200/1800/2400 here would mean training past the matched horizon to reach a
  # familiar-looking number, which would defeat the arm.
  save_steps: 530
  max_checkpoints: 4

promotion:
  requires_executed_suite: tool_use_core
  policy_version: tool_use_promotion_v3
  must_pass:
    parse_valid_rate_min: 0.99
  max_regression:
    default: 1.0

reproducibility:
  seed: 42
  precision: bfloat16

speculative_decoding:
  enabled: false
