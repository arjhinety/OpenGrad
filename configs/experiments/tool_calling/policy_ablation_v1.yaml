# PLANNED before Study 001 and never run; kept as a record of the intended mixture ablation.
# Here m0/m1/m2 name three data MIXTURES, not the training stages M0 (SFT), M1 (DPO) and M2
# (distillation) used everywhere else (docs/GLOSSARY.md). No code reads this file.
experiment_family: tool_use_policy_ablation_v1
status: PLANNED
research_question: Does behavioral and residual-driven dataset composition improve reliable tool-use policy over generic source mixing?
base_experiment: tool_calling/qwen35_2b/baseline
interventions:
  - id: m0
    name: source-oriented control
    mixture_config: configs/data/tool_calling/source_baseline_v1.yaml
    mixture_class: source_oriented
  - id: m1
    name: behavior-balanced control
    mixture_config: configs/data/tool_calling/balanced_policy_v1.yaml
    mixture_class: behavior_balanced
  - id: m2
    name: residual-driven hypothesis
    mixture_config: configs/data/tool_calling/residual_policy_v1.yaml
    mixture_class: residual_driven
    requires: baseline_residual_profile
    status: UNRESOLVED_UNTIL_BASELINE
controls:
  identical_base_checkpoint: true
  matched_training_tokens: where_feasible
  optimizer_family: record_per_run
  evaluation_suite: same_held_out_suite_for_all
  sampling_settings: record_per_run
results: NOT_AVAILABLE
semantics:
  m0: Fixed source-oriented mixture control; historical proportions are hypotheses only.
  m1: Fixed behavior-balanced mixture control; weights are hypotheses until materialization audit.
  m2: Baseline-dependent residual hypothesis; no weights or claims are valid before baseline evidence.
