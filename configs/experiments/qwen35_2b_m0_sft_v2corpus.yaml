experiment_id: qwen35_2b_m0_sft_v2corpus
hypothesis: >-
  M0 on corpus v2: reproducing the M0 experiment against the v2 candidate corpus, which differs
  from v1 in exactly one decisive respect — it contains tool-call supervision.

  Measured on identical raw input at the training boundary, the corrected Glaive adapter takes
  that source from 48,757 trainable records carrying zero tool calls to 97,475 carrying 48,726.
  Across the whole corpus the number of supervised records whose target contains a `<tool_call>`
  moves from 9 of 55,719 (0.0162%) in v1 to roughly half of everything trainable.

  This is the test of the root cause. Both M0 and M1 failed the same way on v1 — call_f1 fell
  monotonically while over-calling vanished — and the claim was that the cause is the absence of
  a behaviour from the training signal rather than the training procedure. If that claim is
  right, the same procedure on v2 behaves differently.

  The corpus is a partial rebuild: xlam and button are gated upstream and looptool's source was
  not located, so v2 is three sources of six and is not a drop-in replacement for v1. v1 is
  untouched and B0 remains pinned to it.

model:
  model_id: Qwen/Qwen3.5-2B
  model_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
  tokenizer_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc

datasets:
  manifest_ids:
    - canonical_v2
  hashes:
    canonical_v2: 09018d260731542c804cade53594be1fdaaabd7c80a60d784bd470758b0b87f1
  # The v2 candidate release. The rendering contract is unchanged, so its cache is separate
  # rather than shared: two different corpora must not evict each other's rendered samples.
  release_dir: .release/hf/toolpolicy-canonical-v2
  source_manifests:
    - glaive-function-calling-v2
    - toolace
    - when2call

trainer:
  type: sft
  tuning_method: full
  learning_rate: 1.0e-5
  micro_batch_size: 8
  # Activation memory tracks batch width, not sequence count; see docs/SFT_TRAINING.md.
  micro_batch_tokens: 4096
  gradient_accumulation_steps: 2
  max_steps: 2400
  warmup_steps: 120
  max_seq_length: 2048
  scheduler: cosine
  gradient_clipping: 1.0
  gradient_checkpointing: true
  optimizer: adamw_torch
  optimizer_state: fp32

evaluation:
  suite: tool_use_core
  baseline_experiment: tool_calling/qwen35_2b/baseline
  primary_metrics:
    - call_precision
    - call_recall
    - call_f1
    - over_call_rate
    - under_call_rate
    - clarification_accuracy
    - unsupported_accuracy
    - parse_valid_rate

generation:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 512

checkpointing:
  save_steps: 600
  max_checkpoints: 4

promotion:
  requires_executed_suite: tool_use_core
  must_pass:
    parse_valid_rate_min: 0.99
  max_regression:
    default: 1.0

reproducibility:
  seed: 42
  precision: bfloat16

speculative_decoding:
  enabled: false
