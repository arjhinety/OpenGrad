experiment_id: m0_v2_final_minus_xlam_fixed_compute
hypothesis: >-
  Joint xLAM-plus-CALL_PREDICTION removal, FIXED-COMPUTE arm. The completed
  `m0_sft_canonical_v2_final` run is the reference and is not modified or rerun. This run filters
  xLAM from the identical frozen corpus; because xLAM is currently the only source providing
  `CALL_PREDICTION`, that source filter also removes the corpus's entire call-prediction
  supervision channel.

  THE QUESTION THIS ARM ANSWERS. Under the same 2,400-step optimization and GPU budget, what is
  the effect of removing xLAM together with `CALL_PREDICTION`? Everything else -- base checkpoint,
  seed, optimizer, learning rate, scheduler, batch geometry, sequence length, precision, renderer,
  loss masking, checkpoint cadence, promotion policy, and both evaluation partitions -- is held
  identical to the reference.

  WHAT THIS ARM CANNOT SEPARATE, STATED IN ADVANCE. It cannot distinguish xLAM source identity or
  content from supervision type: those variables are perfectly aligned in Canonical-v2. It also
  removes 56,090 of 161,966 trainable records, so at an unchanged 2,400 steps the smaller corpus
  receives more effective exposure: 0.363 corpus passes against the reference's 0.237, or 1.53x.
  Any observed difference therefore combines the joint source/channel removal with extra passes
  over `COMPLETE_TRAJECTORY`. The matched-exposure arm exists to expose that compute/exposure
  sensitivity, and the two arms are reported together or not at all.

  WHAT COUNTS AS EVIDENCE. A single seeded run is a finding to record and test again, not settled
  attribution. No xLAM-specific causal claim is valid unless another evidence-backed
  `CALL_PREDICTION` source makes source identity separable from supervision type. A separate
  `CALL_PREDICTION`-only versus `COMPLETE_TRAJECTORY`-only design studies supervision composition,
  but it remains source-confounded in the present corpus and is not executed by this arm.

model:
  model_id: Qwen/Qwen3.5-2B
  model_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
  tokenizer_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc

datasets:
  manifest_ids:
    - canonical_v2_final
  hashes:
    canonical_v2_final: 8ced403b996e563d6e279aee7fdb346fc829fe5ff6af9daf8ef47c0a4007e161
  release_dir: .release/hf/toolpolicy-canonical-v2-final
  # THE JOINT INTERVENTION. This byte-preserving source filter removes xLAM and, because source and
  # contract are perfectly aligned here, all CALL_PREDICTION supervision. The retained 105,876
  # records keep their original bytes, contracts, rendering, loss masks, contamination decisions,
  # and provenance. The parent corpus fingerprint remains pinned.
  exclude_sources:
    - xlam-function-calling-60k
  # The yield report for THIS view of the corpus. Readiness reads the evidence for the corpus a
  # run actually trains on; gating a filtered run on the unfiltered report would include the
  # source this run removed.
  yield_report: reports/data/canonical-v2-final-minus-xlam-yield.json
  source_manifests:
    - glaive-function-calling-v2
    - toolace
    - when2call

# The complete post-filter contract set, declared explicitly. This is not an empty or inferred
# selection: all 105,876 retained trainable records are COMPLETE_TRAJECTORY. Readiness fails closed
# with SUPERVISION_SELECTION_MISMATCH if this declaration names a contract absent after filtering.
supervision:
  include:
    - COMPLETE_TRAJECTORY

trainer:
  type: sft
  tuning_method: full
  learning_rate: 1.0e-5
  micro_batch_size: 8
  # Activation memory tracks batch width, not sequence count; see docs/SFT_TRAINING.md.
  micro_batch_tokens: 4096
  gradient_accumulation_steps: 2
  # FIXED COMPUTE. Unchanged from the reference so the budget is equal by construction.
  max_steps: 2400
  warmup_steps: 120
  max_seq_length: 2048
  scheduler: cosine
  gradient_clipping: 1.0
  gradient_checkpointing: true
  optimizer: adamw_torch
  optimizer_state: fp32

evaluation:
  suite: tool_use_core
  baseline_experiment: tool_calling/qwen35_2b/baseline
  # Frozen. Shared with the reference so the two are selected and confirmed on identical evidence.
  checkpoint_selection_manifest: reports/evaluation/behavioral-heldout-v2.manifest.json
  primary_metrics:
    - call_precision
    - call_recall
    - call_f1
    - over_call_rate
    - under_call_rate
    - clarification_accuracy
    - unsupported_accuracy
    - parse_valid_rate

generation:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 512

checkpointing:
  # Cadence preserved so checkpoint-indexed comparisons against the reference are 1:1.
  save_steps: 600
  max_checkpoints: 4

promotion:
  requires_executed_suite: tool_use_core
  policy_version: tool_use_promotion_v3
  must_pass:
    parse_valid_rate_min: 0.99
  max_regression:
    default: 1.0

reproducibility:
  seed: 42
  precision: bfloat16

speculative_decoding:
  enabled: false
