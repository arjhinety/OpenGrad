experiment_id: m1_dpo_canonical_v2_final
parent_experiment_id: m0_sft_canonical_v2_final
hypothesis: >-
  M1 tests whether DPO can calibrate the healthy selected M0-final-v2 policy without destroying
  its recovered calling capability. M0 already moved the policy from B0's over-calling frontier;
  this run is not authorized to increase call recall at any cost. It targets the frontier jointly:
  retain strong call recall and precision, reduce unnecessary calls, improve unsupported handling,
  and preserve clarification behavior. Tool selection and argument/schema validity remain explicit
  evaluation dimensions but are not promoted as measured until the evaluator computes them.

  The student starts from the selected full-corpus M0-final-v2 checkpoint only. The DPO reference
  is an independently loaded copy of that same checkpoint, so this is calibration around the M0
  policy rather than a return to the base model. The old base-starting DPO runs remain historical
  evidence and are not parents of this experiment.

  Preference data is a frozen local calibration set: actual deterministic outputs from the pinned
  base and selected M0 on Canonical-v2 training prompts, retaining only cases where one output
  matches the canonical behavior decision, plus a bounded hash-ranked slice of curated When2Call
  preferences for clarification, unsupported and direct-answer behavior. Frozen DEV and
  confirmatory IDs are excluded before local generation. No paid external API was used.

model:
  model_id: Qwen/Qwen3.5-2B
  model_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
  tokenizer_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc

datasets:
  manifest_ids:
    - m1_calibration_preference_pairs_v1
  hashes:
    m1_calibration_preference_pairs_v1: d39168948d09fc3c355cd83f9f0857f310086322b0968fd2e7d78125150faef4
    preference: d39168948d09fc3c355cd83f9f0857f310086322b0968fd2e7d78125150faef4
  preference_path: data/processed/m1_calibration_preference_pairs_v1.jsonl
  preference_prompt_format: rendered
  manifest_paths:
    - reports/data/m1-calibration-preference-pairs-v1.json
  source_manifests:
    - m1_local_calibration_pairs_v1

trainer:
  type: dpo
  initial_checkpoint: runs/m0_sft_canonical_v2_final/checkpoints/checkpoint-1800
  initial_checkpoint_sha256: 7144579aeecec8b4de25f193ab63085efdf8d9d76b85ed915352291b0152277a
  parent_checkpoint_id: m0_sft_canonical_v2_final::checkpoint-1800
  reference: explicit_checkpoint
  reference_checkpoint: runs/m0_sft_canonical_v2_final/checkpoints/checkpoint-1800
  beta: 0.05
  learning_rate: 5.0e-7
  scheduler: cosine
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  max_steps: 120
  warmup_steps: 12
  max_seq_length: 2048

evaluation:
  suite: tool_use_core
  baseline_experiment: tool_calling/qwen35_2b/baseline
  parent_experiment: m0_sft_canonical_v2_final
  checkpoint_selection_manifest: reports/evaluation/behavioral-heldout-v2.manifest.json
  primary_metrics:
    - call_precision
    - call_recall
    - call_f1
    - over_call_rate
    - under_call_rate
    - clarification_accuracy
    - unsupported_accuracy
    - parse_valid_rate
    - macro_behaviour_score


generation:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 512

checkpointing:
  save_steps: 30
  max_checkpoints: 4

promotion:
  requires_executed_suite: tool_use_core
  policy_version: tool_use_promotion_v4
  must_pass:
    parse_valid_rate_min: 0.99
  max_regression:
    default: 1.0

reproducibility:
  seed: 42
  precision: bfloat16

speculative_decoding:
  enabled: false
