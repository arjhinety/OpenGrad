experiment_id: qwen35_2b_m0_sft_full_v3
hypothesis: >-
  M0 (full): supervised fine-tuning on the canonical tool-policy corpus should sharpen the
  call/no-call decision boundary that B0 showed to be miscalibrated. B0 reaches call recall
  0.972 but over-calls on 64.3% of examples whose gold decision is not CALL, so the
  intervention under test is decision calibration, not tool-call syntax.

  This configuration supersedes configs/experiments/m0_sft.yaml, which specifies 50 optimizer
  steps. At the pinned effective batch that is ~400 examples, roughly 0.8% of the trainable
  corpus: it is a bounded bring-up recipe, not a corpus-scale M0. Its meaning is left intact
  rather than rewritten, and this file is the corpus-scale experiment.

  Version 3 of this identity. v1 OOM'd at step 11 (a single 8-sequence forward pass peaked
  at 49 GiB). v2 fixed the micro-batch split and added length bucketing, then OOM'd at
  step 1, because bucketing made maximum-width batches reachable within the first few
  steps: a 4x2046-token batch needs roughly 80 GiB of activation on this architecture.
  v3 bounds each micro-batch by a token budget rather than a sequence count. Neither v1
  nor v2 wrote a checkpoint; both are recorded as FAILED.

model:
  model_id: Qwen/Qwen3.5-2B
  model_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
  tokenizer_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc

datasets:
  manifest_ids:
    - canonical_v1
  hashes:
    canonical_v1: 181b3fba1d722cddfab9026ffeb0ab47783398e96dac06be6b727183b017a911
  source_manifests:
    - xlam-function-calling-60k
    - glaive-function-calling-v2
    - looptool-23k
    - when2call
    - toolace
    - button

trainer:
  type: sft
  # Explicit, never inferred: full fine-tuning and PEFT differ enough in what they measure
  # that an implicit default would change the experiment's meaning.
  tuning_method: full
  learning_rate: 1.0e-5
  # Batch 8 in one forward pass peaked at 49 GiB and then OOM'd on a long draw. The effective
  # batch is unchanged at 8; it is split into two micro-batches to bound the activation spike.
  micro_batch_size: 8
  # Activation memory tracks batch width, not sequence count. The v2 launch OOM'd on a
  # 4x2046-token batch: roughly 10 MB of activation per token on this architecture. 4096
  # tokens per micro-batch leaves headroom against that.
  micro_batch_tokens: 4096
  gradient_accumulation_steps: 2
  # Measured on this box: ~1.6k supervised tokens/s, so an effective batch of 8 costs about
  # 2s per optimizer step and 2400 steps is ~1.5h. The schedule is sized to fit an
  # evaluation-able curve, not to complete an epoch: one full epoch is ~4h.
  max_steps: 2400
  warmup_steps: 120
  max_seq_length: 2048
  scheduler: cosine
  gradient_clipping: 1.0
  gradient_checkpointing: true
  optimizer: adamw_torch
  optimizer_state: fp32

evaluation:
  suite: tool_use_core
  # The comparison that matters for this intervention: the same frozen behavioral held-out
  # suite B0 was measured on, so the delta is like-for-like.
  baseline_experiment: tool_calling/qwen35_2b/baseline
  primary_metrics:
    - call_precision
    - call_recall
    - call_f1
    - over_call_rate
    - under_call_rate
    - clarification_accuracy
    - unsupported_accuracy
    - parse_valid_rate

generation:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 512

checkpointing:
  # Six checkpointable points across the run. A checkpoint is ~3.8 GiB of weights (the
  # optimizer state is retained only for the newest one), so this stays inside the disk budget.
  save_steps: 400
  max_checkpoints: 6

promotion:
  # Expressed only against evaluations that can actually be run. BFCL V4, tau2, and the other
  # external families are still FROZEN_NOT_EXECUTED, so they cannot gate a decision yet and
  # are deliberately absent rather than pinned to aspirational numbers.
  requires_executed_suite: tool_use_core
  must_pass:
    parse_valid_rate_min: 0.99
  max_regression:
    default: 1.0

reproducibility:
  seed: 42
  precision: bfloat16

speculative_decoding:
  enabled: false
