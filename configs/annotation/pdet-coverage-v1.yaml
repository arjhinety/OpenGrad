# Annotation of P-DET-COVERAGE-v1, layer B: the prose decision (Study 002, study_002_prereg_v4).
#
# Preregistration: docs/research/study-002/30-PDET-COVERAGE-PREREGISTRATION-DRAFT.md §10 (adopted).
# Rubric: 22 §1-4 as for P-DET-v1, narrowed by 30 §2-3 (DIRECT at the pre-action decision point).
#
#   python scripts/run_external_annotation.py pdet-coverage-v1 --annotator model.gpt-5.6-sol
#
# The population file holds both layers and is hash-pinned whole; this task selects layer B on the server.
# The layer is blinded: it decides membership and is never sent to the browser or to a model annotator.
# The reference is a three-model consensus (amendment study_002_prereg_v5, doc 34), declared below.

task_id: pdet-coverage-v1
version: "1"
title: P-DET-COVERAGE-v1 policy-mode annotation
task_type: single_label
annotation_schema_version: pdet-coverage-annotation-v1

labels: [CALL, DIRECT, CLARIFY, UNSUPPORTED, UNKNOWN]
shortcuts: {"1": CALL, "2": DIRECT, "3": CLARIFY, "4": UNSUPPORTED, "5": UNKNOWN}
unknown_labels: [UNKNOWN]

source:
  path: reports/pdet-coverage/pdet-coverage-v1.population.jsonl
  format: jsonl
  id_field: pdetcov_id
  expected_sha256: 755bc16e79ceb1cb9e461c0fe8b9125628c16f263ed24f9e008f55b613a7158c
  select: {field: layer, equals: B}
  expected_items: 306

# 30 §10: the user message, the offered tools and the response. No system message (32 §2).
fields:
  user:
    label: User message
    path: user_message
  assistant:
    label: Assistant response being classified
    path: assistant_response
  tools:
    label: Available tools
    path: tools

# 30 §10, blind to: the source dataset (it cues the label), the stratum, layer and cue flags, the gate
# status, the adapter and every provenance field that names or implies a source. Never displayed, filtered
# on or sent to the browser. No metadata chips and no filters are declared, for the same reason.
blind_fields:
  - gold_policy_label
  - ambiguity_status
  - annotator_id
  - annotator_rationale
  - boundary_rule_cited
  - annotation_version
  - layer
  - stratum
  - trajectory_gate
  - source_dataset
  - source_name
  - source_revision
  - upstream_id
  - record_id
  - raw_record_hash
  - canonical_hash
  - features_sha256
  - classifier_input_contract
  - classifier_version_at_selection
  - structured_calls

extra_fields:
  - key: ambiguity_status
    label: Ambiguity status
    type: select
    options: [NONE, AMBIGUOUS_TWO_MODES, NON_SUBSTANTIVE, MISSING_CONTEXT, EMPTY_TOOLSET]
    default: NONE
    required: true
  # Optional from the start (30 §10, as under amendment 29).
  - key: annotator_rationale
    label: Rationale
    type: text
    required: false
    adjudication: false
    help: Optional. A short note on why, or on what was hard, if you want one.
  - key: boundary_rule_cited
    label: Boundary rule (22 §2)
    type: select
    options: ["1", "2", "3", "4", "5", "6", "7", "8", "none"]
    default: "none"
    required: false
    help: Cite 1-8 when a boundary discrimination decided the label.

constraints:
  - when_label_in: [UNKNOWN]
    field: ambiguity_status
    forbidden: [NONE]
    message: UNKNOWN needs an ambiguity reason (23 §2 - set ambiguity_status).
  - when_label_not_in: [UNKNOWN]
    field: ambiguity_status
    allowed: [NONE]
    message: An ambiguous item is labeled UNKNOWN; a mode label needs ambiguity_status NONE (23 §2).

disagreement_keys: [label, ambiguity_status]

adjudication_fields:
  - key: decision_tree_step
    label: Deciding rule (22 §3 step)
    type: select
    options: ["1", "2", "3", "4", "5", "6", "7", "8"]
    required: true

# 30 §10: the same excerpts as P-DET-v1 plus 30 §2-3. Never 30 §4-§13: they name sources, strata, cues and
# the layer split. Omitted text never reaches the browser.
instructions:
  - title: Checklist (26)
    file: docs/research/study-002/26-PDET-ANNOTATOR-CHECKLIST.md
  - title: Protocol - modes, boundaries, decision tree (22 §1-4)
    file: docs/research/study-002/22-PDET-PROTOCOL.md
    include_sections: ["1.", "2.", "3.", "4."]
  - title: Instrument - fields, deciding, passes (23 §2, 3, 5, 7)
    file: docs/research/study-002/23-PDET-ANNOTATION-INSTRUMENT.md
    include_sections: ["2.", "3.", "5.", "7."]
  - title: This population - DIRECT and post-tool responses (30 §2-3)
    file: docs/research/study-002/30-PDET-COVERAGE-PREREGISTRATION-DRAFT.md
    include_sections: ["2.", "3."]

# The server refuses to start if a served rubric text contains one of these: P-DET-v1's challenge-family
# identifiers (the same rubric documents are served) and this population's stratum, cue, gate and match-kind
# identifiers (src/opengrad/verification/pdet_coverage.py).
instruction_forbidden_terms:
  - challenge_families
  - "families:"
  - question_mark
  - question_without_mark
  - refusal_with_question
  - refusal_plain
  - tool_mentioned_no_payload
  - caveat_then_content
  - multi_clause_question
  - no_tools_offered
  - short_plain
  - serialized_call_shape
  - advice_external_service
  - polite_followup
  - HEURISTIC_REGEX
  - refusal_signal
  - stratum
  - strata
  - QUESTION_CUES
  - HEDGE_CUES
  - TEXTUAL_CALL
  - INVOCATION_TALK
  - invocation_talk
  - identifier_shaped_tool_name
  - word_tool_name
  - trajectory_gate
  - trajectory_issue
  - pdetcov_index

record_keys:
  item_id: pdetcov_id
  label: gold_policy_label
  annotation_schema_version: annotation_version

output:
  dir: reports/pdet-coverage/annotation
  session_file: "pdet-coverage-v1.annotations.{annotator_id}.{session_id}.jsonl"
  history_file: "audit/pdet-coverage-v1.history.{annotator_id}.{session_id}.jsonl"
  adjudication_history_file: audit/pdet-coverage-v1.adjudication-history.jsonl
  disagreements_file: pdet-coverage-v1.disagreements.jsonl
  adjudication_file: pdet-coverage-v1.adjudicated.jsonl
  gold_file: pdet-coverage-v1.gold.jsonl
  manifest_file: pdet-coverage-v1.annotation-manifest.json

protected_paths:
  - reports/pdet-coverage/pdet-coverage-v1.population.jsonl
  - reports/pdet-coverage/pdet-coverage-v1.manifest.json
  - reports/pdet-coverage/pdet-coverage-v1.manifest.json.sha256

state_db: .annotation/pdet-coverage-v1.sqlite3

# Human gold designs, kept for any human pass that is ever added (34 §4 item 4). The three-model consensus
# reference is computed separately (34), never frozen as human gold, so no composite design is allowed.
freeze:
  allowed_designs: [two_pass, single_annotator]
  require_adjudication: true
  single_annotator_review:
    flagged: true
    labels: [UNKNOWN]
    field_not_in:
      boundary_rule_cited: ["none"]

# Amendment study_002_prereg_v5 (docs/research/study-002/34-PDET-COVERAGE-MODEL-CONSENSUS-AMENDMENT.md): the
# reference labels come from these three non-Claude models, each labelling every item independently and blind,
# run by scripts/run_external_annotation.py. Their labels are model judgments (annotator_kind: model), never
# human labels. No Claude model is declared: Claude builds the classifier this population tests.
model_annotators:
  - annotator_id: model.gemini-3.8-flash-high
    model: Gemini 3.8 Flash (High)
    procedure: configs/annotation/pdet-coverage-v1.model-procedure.md
    procedure_sha256: 4d36a3f8d97ebd5b62987ee2c01118ac1fafb4b0625673f867288f986d84e7ab
    authorization: docs/research/study-002/34-PDET-COVERAGE-MODEL-CONSENSUS-AMENDMENT.md
  - annotator_id: model.gpt-5.6-sol
    model: gpt-5.6-sol
    procedure: configs/annotation/pdet-coverage-v1.model-procedure.md
    procedure_sha256: 4d36a3f8d97ebd5b62987ee2c01118ac1fafb4b0625673f867288f986d84e7ab
    authorization: docs/research/study-002/34-PDET-COVERAGE-MODEL-CONSENSUS-AMENDMENT.md
  - annotator_id: model.deepseek-v4.1-flash
    model: deepseek-v4.1-flash
    procedure: configs/annotation/pdet-coverage-v1.model-procedure.md
    procedure_sha256: 4d36a3f8d97ebd5b62987ee2c01118ac1fafb4b0625673f867288f986d84e7ab
    authorization: docs/research/study-002/34-PDET-COVERAGE-MODEL-CONSENSUS-AMENDMENT.md
