# Per-source trainability expectations for the renderability/trainability gate.
#
# Canonical retention and trainability are different properties. This file states what each
# source is *expected* to contribute at the training boundary, so that a build can fail when a
# source silently collapses instead of passing because its canonical counts look healthy.
#
# `expects_tool_calls: true` marks a source whose purpose is to teach tool invocation. For such
# a source, a supervised tool-call target ratio near zero means the source is contributing
# nothing to the behaviour the mixture exists to teach, and the gate reports COLLAPSE rather
# than OK. The floors are deliberately well below the observed values so that they detect
# collapse, not normal variation.
schema_version: 1

defaults:
  # A source must turn at least half of its canonical records into trainable targets unless
  # its own entry says otherwise.
  min_yield_ratio: 0.5
  min_tool_call_target_ratio: 0.0
  expects_tool_calls: false

sources:
  xlam-function-calling-60k:
    # Pure single-turn call prediction: the supervised target is the call itself.
    expects_tool_calls: true
    min_yield_ratio: 0.5
    min_tool_call_target_ratio: 0.5
  glaive-function-calling-v2:
    expects_tool_calls: true
    min_yield_ratio: 0.5
    min_tool_call_target_ratio: 0.3
  toolace:
    expects_tool_calls: true
    # Measured 0.204 (11,051 canonical -> 2,259 trainable). The floor is NOT set below that
    # measurement: fitting a threshold to the number it is meant to judge is how a gate stops
    # being a gate, and the next degradation would then pass unnoticed.
    #
    # The gap is real and deliberate, not a defect. 8,476 of ToolACE's records end on an
    # assistant call with no tool result, so the complete-trajectory contract quarantines them.
    # Reclassifying them as CALL_PREDICTION would recover the yield, and the available bytes do
    # not establish that they are intended call-prediction targets rather than truncated
    # trajectories, so that is not done.
    #
    # With 0.3 the gate therefore reports ANOMALY for a source that is behaving exactly as
    # instructed. ANOMALY is reported and does not block readiness, which is the intended
    # outcome: a reader sees that 79.6% of this source is quarantined by decision, rather than
    # seeing a green tick that hides it.
    #
    # All of the above describes Canonical-v2, which is unchanged. From adapter version 2.2.0,
    # canonical-v3 reads the call-final records of one measured structural shape as CALL_PREDICTION
    # (adapt_toolace_v3), prospectively and as OpenGrad's inference, not ToolACE's statement
    # (docs/research/study-002/31-CANONICAL-V3-SOURCES-AND-NORMALIZATION-V3.md §9). The floor is not
    # moved for that: it is a collapse detector, and a canonical-v3 yield report is not yet measured.
    min_yield_ratio: 0.3
    min_tool_call_target_ratio: 0.3
  looptool-23k:
    expects_tool_calls: true
    min_yield_ratio: 0.3
    min_tool_call_target_ratio: 0.3
  button:
    expects_tool_calls: true
    min_yield_ratio: 0.3
    min_tool_call_target_ratio: 0.3
  when2call:
    # Measured, and it contradicts the assumption this file originally encoded. When2Call's
    # canonical records are `user -> assistant(prose)`: 0 of 6,505 carry a structured tool call
    # or a tool result, and 0 carry a `<TOOLCALL>` marker in the text either. What it supervises
    # is the *decision* -- decline, ask for the missing detail, or answer directly -- expressed
    # in natural language, which is exactly the behaviour the B0 baseline fails most badly
    # (unsupported-accuracy 0.0131, clarification-accuracy 0.1009).
    #
    # So "should this source produce structured calls" is the wrong question here, and requiring
    # it would fail a healthy source rather than detect a collapse. `min_yield_ratio` still
    # guards the failure that matters: If When2Call stopped producing trainable decision targets,
    # this gate fires.
    expects_tool_calls: false
    min_yield_ratio: 0.5

