# Canonical corpus v2 — a locally built candidate, NOT a published release.
#
# v1 (configs/releases/toolpolicy_canonical_v1.yaml) is pinned by B0 and every result that
# depends on it, and it is left untouched. This file exists to test one hypothesis with a
# measurement attached: that the tool-call collapse both M0 and M1 exhibited is caused by the
# training corpus containing almost no tool-call supervision, rather than by the training
# procedure.
#
# Measured on identical raw input, at the training boundary rather than at materialization:
#
#   adapter  trainable      records with tool calls   training-boundary rejections
#   v1       48,757 (48.9%) 0                         50,900  (all SEM_ORPHAN_RESULT)
#   v2       97,475 (99.1%) 48,726 (50.0%)              864
#
# Composition differs from v1 for sources that could not be fetched here: xlam and button are
# gated (HTTP 401) and looptool's upstream was not located, so this release is three sources
# rather than six. Read it as an ablation on the presence of tool-call supervision, not as a
# drop-in replacement for v1.
release_name: OpenGrad ToolPolicy Canonical (v2 candidate, partial)
release_version: v2.0.0-local-partial
hub_repository: unpublished/OpenGrad-ToolPolicy-Canonical-v2-partial
# This release is three sources of six, so its card states that rather than inheriting
# v1's identity and v1's provenance sections.
card_directory: release/huggingface/toolpolicy-canonical-v2
release_class: PRE_TRAINING_CANONICAL_RELEASE
canonical_schema_version: tool_use_ir_v1
behavior_taxonomy_version: tool-use-behavior-taxonomy-v1
