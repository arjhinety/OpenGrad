# Canonical corpus v2 FINAL — the completed heterogeneous-supervision corpus.
#
# Distinct from the historical partial-v2 snapshot in three ways, all measured:
#
#   1. Four sources instead of three. xLAM is included and carries its full 59,370-record
#      contribution; the partial snapshot's xLAM contribution was 0 trainable records.
#   2. Every record declares an explicit supervision contract (`metadata.supervision`), so
#      `CALL_PREDICTION` and `COMPLETE_TRAJECTORY` targets are validated, rendered and measured
#      separately instead of being forced into one trajectory shape.
#   3. The partial snapshot's when2call artifact was an INTERRUPTED materialization: it had read
#      9,162 of the raw file's 15,000 rows and was never finalized (`finalized: null`,
#      `written: 0`), publishing 4,000 records. This build reads all 15,000 and retains 6,505.
#
# Not included, and why:
#   button    upstream repository is access-gated (HTTP 401); not fetched
#   looptool  upstream source was not located; not fetched
#
# The partial-v2 snapshot is left exactly as published and is not overwritten by this build.
release_name: OpenGrad ToolPolicy Canonical (v2 final)
release_version: v2.0.0
hub_repository: arrochi112/OpenGrad-ToolPolicy-Canonical-v2
card_directory: release/huggingface/toolpolicy-canonical-v2-final
release_class: PRE_TRAINING_CANONICAL_RELEASE
canonical_schema_version: tool_use_ir_v1
behavior_taxonomy_version: tool-use-behavior-taxonomy-v1
supervision_contract_version: supervision_contract_v1
redistribution_policy: exclude_uncleared
allow_gated_sources: false
shard_size: 1000
