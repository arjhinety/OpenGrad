[project]
name = "opengrad"
version = "0.1.0"
description = "Reproducible research infrastructure for capability-efficiency studies of small open-weight language models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "OpenGrad contributors" }]
dependencies = []

[project.optional-dependencies]
research = ["pyyaml>=6.0"]
data = ["datasets>=2.20", "pyarrow>=15.0"]
evaluation = ["jsonschema>=4.23"]
training = ["torch", "transformers", "trl", "peft"]
inference = ["llama-cpp-python"]
# Optional optimization producer layer. ModelOpt is NEVER a core dependency; the
# optimization package imports and the deterministic mock work without it.
optimization = ["nvidia-modelopt"]
# Generates the charts and HTML page in `reports/visual/`. Kept out of `dev` because it is a
# presentation tool rather than a test dependency, and out of the core because the core has none.
visualization = ["matplotlib>=3.8"]
gpu-evaluation = ["torch==2.13.0", "transformers==5.16.1", "pyyaml==6.0.3", "pyarrow>=15.0"]
benchmark-core = ["pyyaml>=6.0", "jsonschema>=4.23", "pyarrow>=15.0"]
benchmark-agent = ["pyyaml>=6.0", "jsonschema>=4.23"]
benchmark-terminal = ["pyyaml>=6.0", "jsonschema>=4.23"]
benchmark-speculative = ["pyyaml>=6.0", "jsonschema>=4.23", "pyarrow>=15.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6.0", "jsonschema>=4.23", "pyarrow>=15.0"]

[project.scripts]
opengrad = "opengrad.cli:main"
opengrad-preflight = "opengrad.cli:preflight_cli"
opengrad-validate = "opengrad.registry.validate:main"
opengrad-contamination = "opengrad.contamination.cli:main"
opengrad-data-audit = "opengrad.cli:data_audit_cli"
opengrad-data = "opengrad.data.cli:main"
opengrad-benchmark = "opengrad.benchmarks.cli:benchmark_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opengrad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Some tests import shared fixtures as `tests.<module>`, which needs the repository root on
# sys.path. `python -m pytest` adds it implicitly; the `pytest` entry point CI uses does not.
pythonpath = ["."]
markers = [
  "network: resolves upstream pins over the network; excluded from the deterministic suite. The release gate is `scripts/verify_publication.py`, and these tests only guard the machinery behind it.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# third_party/ is vendored upstream code kept byte-identical (see its PROVENANCE.json);
# release/ holds frozen handoff bundles generated by scripts/build_*_handoff.py.
extend-exclude = ["third_party", "release"]

[tool.ruff.lint.per-file-ignores]
# Must stay byte-identical to the vendored copies in release/*/opengrad_min/policy.py
# (tests/evaluation/test_executorch_handoff.py), so it cannot be edited for style alone.
"src/opengrad/promotion/quantization.py" = ["I001", "UP035", "TRY004"]

[tool.mypy]
python_version = "3.11"
strict = true
