[project]
name = "opengrad"
version = "0.1.0"
description = "Reproducible research infrastructure for capability-efficiency studies of small open-weight language models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "OpenGrad contributors" }]
dependencies = []

[project.optional-dependencies]
research = ["pyyaml>=6.0"]
data = ["datasets>=2.20", "pyarrow>=15.0"]
evaluation = ["jsonschema>=4.23"]
training = ["torch", "transformers", "trl", "peft"]
inference = ["llama-cpp-python"]
gpu-evaluation = ["torch==2.13.0", "transformers==5.16.1", "pyyaml==6.0.3", "pyarrow>=15.0"]
benchmark-core = ["pyyaml>=6.0", "jsonschema>=4.23", "pyarrow>=15.0"]
benchmark-agent = ["pyyaml>=6.0", "jsonschema>=4.23"]
benchmark-terminal = ["pyyaml>=6.0", "jsonschema>=4.23"]
benchmark-speculative = ["pyyaml>=6.0", "jsonschema>=4.23", "pyarrow>=15.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6.0", "jsonschema>=4.23"]

[project.scripts]
opengrad = "opengrad.cli:main"
opengrad-preflight = "opengrad.cli:preflight_cli"
opengrad-validate = "opengrad.registry.validate:main"
opengrad-contamination = "opengrad.contamination.cli:main"
opengrad-data-audit = "opengrad.cli:data_audit_cli"
opengrad-data = "opengrad.data.cli:main"
opengrad-benchmark = "opengrad.benchmarks.cli:benchmark_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opengrad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
