schema_version: 1
# Every screening conforms to registry/source_screening.schema.json. A screening records the need, the
# criteria, the search and every candidate considered -- including the rejected ones -- so that a
# reader can see what was looked at and why each exclusion happened. Flow counts are derived from the
# records by scripts/reporting/generate_source_views.py, never typed here. The training firewall does
# not read this file; an adopted candidate moves to registry/datasets.yaml.
# Procedure: docs/datasets/ADDING_A_SOURCE.md.
record_schema: registry/source_screening.schema.json
screenings:
- id: study-002-answer-heldout
  question: >-
    Which public, licence-compatible datasets can supply Study 002's held-out ANSWER stratum: prompts
    where a tool-calling model is offered tools, none is needed, and the right behaviour is a direct
    prose answer from general knowledge?
  purpose: EVALUATION_POPULATION
  requirement_source: docs/research/study-002/06-SPLIT-SPEC.md
  opened: '2026-09-24'
  owner_decision:
    status: ADOPTED
    adopted:
    - bfcl-irrelevance
    - bfcl-live-irrelevance
    - natural-questions-dev
    recorded_in: docs/research/study-002/41-ANSWER-STRATA-AMENDMENT.md
    date: '2026-09-24'
  search:
    date: '2026-09-24'
    method: >-
      Named candidates from the request plus web and literature search, including adversarial queries
      on BFCL label quality and dataset derivation. Every candidate was read at its primary artifact
      (dataset card, repository LICENSE, paper data-construction section). BFCL was additionally read
      from its raw files at the pinned revision, sampled and probed against OpenGrad's corpora.
    report: reports/source-screening/study-002-answer-heldout/REPORT.md
    artifacts:
    - reports/source-screening/study-002-answer-heldout/answer-sizing-readings.json
    - reports/source-screening/study-002-answer-heldout/bfcl-answer-sizing.json
    - reports/source-screening/study-002-answer-heldout/bfcl-training-overlap.json
  criteria:
  - id: C1
    name: tools_offered
    test: >-
      Each item offers the model at least one tool schema. A QUESTION_SOURCE is NOT_APPLICABLE:
      curation adds the schemas.
  - id: C2
    name: answerable_without_tools
    test: >-
      The source's labels, or a reading of its items, separate questions answerable from general
      knowledge (ANSWER) from questions that need an absent tool (UNSUPPORTED) or clarification.
  - id: C3
    name: licence_permits_redistribution
    test: The data licence, read at the source, permits redistributing items or items derived from them.
  - id: C4
    name: pinned_revision
    test: An immutable revision of the data can be pinned.
  - id: C5
    name: disjoint_from_training
    test: >-
      No shared upstream or derivation with xLAM/APIGen-60k, Glaive v2, ToolACE, When2Call SFT,
      BUTTON or LoopTool-23k, and text collisions with them or with the When2Call MCQ and LLM-judge
      splits are few enough for fingerprint screening to remove.
  - id: C6
    name: released
    test: The data is publicly downloadable now.
  - id: C7
    name: supply
    test: >-
      Contributes ANSWER items toward the n >= 200 floor (385 to resolve 10 points, about 601 for 8
      points; 06-SPLIT-SPEC).
