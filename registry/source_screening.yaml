- id: study-002-punans
  question: >-
    Which public, licence-compatible datasets can supply Study 002's P-UNANS: stand-alone questions that
    no one can answer now (future events, unsolved problems, unknowable facts), on which the right
    behaviour is to decline rather than answer?
  purpose: EVALUATION_POPULATION
  requirement_source: docs/research/study-002/06-SPLIT-SPEC.md
  opened: '2026-09-25'
  owner_decision:
    status: PENDING
  search:
    date: '2026-09-25'
    method: >-
      Papers With Code search (unanswerable, abstention, known-unknowns, false-premise and noncompliance
      queries) and the repository's scholarly search. The AbstentionBench appendix supplied a vetted list of
      20 abstention datasets and 3 excluded ones, each considered here. Every shortlisted or watchlisted
      candidate was downloaded at a pinned revision, checked against its sha256, and counted and probed by
      scripts/audit_punans_supply.py. Excluded candidates were read at their repository or card for the
      licence and the property that excludes them.
    report: reports/source-screening/study-002-punans/REPORT.md
    artifacts:
    - reports/source-screening/study-002-punans/punans-supply.json
  criteria:
  - id: C1
    name: unknowable
    test: >-
      The source's labels, or a reading of its items, identify questions no one can answer now: future
      events, unsolved problems, unknowable facts. Excluded: merely open-ended or subjective questions
      (07-METRIC-SPEC), questions missing context the user could supply (a CLARIFY case, which P-CONF
      already measures), and false premises (a correction, not a refusal, may be the right reply).
  - id: C2
    name: standalone
    test: The question stands alone, with no passage, document or context it depends on.
  - id: C3
    name: licence_permits_redistribution
    test: The data licence, read at the source, permits redistributing items or items derived from them.
  - id: C4
    name: pinned_revision
    test: An immutable revision of the data can be pinned.
  - id: C5
    name: disjoint_from_training
    test: >-
      No shared derivation with OpenGrad's training corpora, and exact-text collisions with them, the
      When2Call held-out questions, P-CONF and P-DET-COVERAGE are few enough for screening to remove.
  - id: C6
    name: time_stable
    test: >-
      The question stays unanswerable over time, or the items that could have resolved since the source
      was written can be identified and removed.
  - id: C7
    name: supply
    test: >-
      Contributes unknowable items toward n >= 385 (study_002_prereg_v8 item B), allowing for losses to
      screening, the time rule and two-model agreement.
  candidates:
  - id: kuq
    display_name: Known Unknown Questions (KUQ), future-unknown and unsolved-problem categories
    kind: ITEM_SOURCE
    locator:
      url: https://huggingface.co/datasets/amayuelas/KUQ
      revision: f99b53aa226dbb0d1b086db3ec352b0da0aa8f41
      files:
      - knowns_unknowns.jsonl
    license:
      value: MIT
      source: https://huggingface.co/datasets/amayuelas/KUQ/blob/f99b53aa226dbb0d1b086db3ec352b0da0aa8f41/README.md
    answer_items:
      basis: DATA_COUNT
      count: 1096
      estimate_artifact: reports/source-screening/study-002-punans/punans-supply.json
      note: future unknown 659 and unsolved problem 437, of 3,437 crowd-written unknowns; 25 of the 1,096 name a year up to 2026.
    verdicts:
      C1: {result: PARTIAL, note: 'Two of six categories fit; controversial, ambiguous, counterfactual and false-assumption questions do not.'}
      C2: {result: PASS}
      C3: {result: PASS}
      C4: {result: PASS}
      C5: {result: PASS, note: '3 exact-text collisions with the training corpora across all 3,437 unknowns; none with the held-out sets.'}
      C6: {result: PARTIAL, note: 'Written in 2023: future questions naming a year up to 2026 may have resolved and must be removed.'}
      C7: {result: PASS}
