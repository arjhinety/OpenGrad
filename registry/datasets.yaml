    experiment_config: configs/experiments/qwen35_2b_m0_sft_v2corpus.yaml
    report: reports/M0_SFT_EXECUTION_REPORT.md
    evaluation_split: When2Call held-out, 3650 distinct examples, pinned 0582f7749df63a96fdc3070932e83e72396ace53
    isolated_variable: corpus (same procedure, hyperparameters, base checkpoint, seed, and evaluation as M0/M1 on v1)
    conclusion: >-
      The tool-call collapse seen on v1 is a data-coverage failure, not a training-procedure
      failure. Under v1 the training signal held 9 tool-call targets in 55719 retained
      records; call_recall fell to 0.0031 and call_f1 to ~0. On this corpus the same
      procedure holds call_recall 0.3931-0.5050 and call_f1 0.5247-0.5995, over_call_rate
      0.0577-0.0989 against the baseline's 0.6425, and call_precision 0.7373-0.7891
      against the baseline's 0.4542.
