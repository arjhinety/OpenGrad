      that with a degenerate near-always-call policy (recall 0.9722, unsupported_accuracy
      0.0131, over_call_rate 0.6425), so no claim is made that SFT on this corpus beats
      the baseline on the headline metric. No checkpoint was promoted.
  notes: 'Locally built candidate, three sources of six: xlam and button are gated upstream
    and looptools source was not located. It exists to test whether the tool-call collapse
    observed on v1 is caused by the absence of tool-call supervision in the training signal,
    and it answered that question in the affirmative. Published as an M0 snapshot; partial
    by construction, and not a drop-in replacement for v1.'

