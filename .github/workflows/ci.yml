name: quality
on:
  push:
  pull_request:
# The workflow reads the repository and nothing else.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a movable tag (tag noted beside each).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Readiness gates check that recorded evidence commits are ancestors of HEAD,
          # which a depth-1 clone cannot answer.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # --locked fails when uv.lock is stale instead of silently re-resolving it.
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run opengrad-validate
      - run: uv run python scripts/preserve_h200_state.py --verify
      - run: uv run python scripts/repo/check_publication_hygiene.py
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: npm run check
        working-directory: integrations/opengrad-mcp
      - run: npm test
        working-directory: integrations/opengrad-mcp
